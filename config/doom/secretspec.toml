[project]
name = "emacs-portability-test"
revision = "1.0"
require_reason = false


# Extend configurations from subdirectories
# extends = [ "subdir1", "subdir2" ]

[profiles.default]
TEST_SECRET = { description = "Test secret for initial setup", required = true }
GMAIL_CREDENTIALS = { description = "Lieer Gmail OAuth credentials JSON", required = true }
GOOGLE_CALENDAR_CLIENT_CREDENTIALS = { description = "Google Calendar OAuth client JSON", required = true }
ORG_GPG_RECOVERY_PRIVATE_KEY = { description = "Org recovery OpenPGP private key backup", required = true }

